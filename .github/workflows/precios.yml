# Guárdalo en tu repo como: .github/workflows/precios.yml
name: Rastreador de precios

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días 8:00 am Bolivia (12:00 UTC)
  workflow_dispatch:         # ejecución manual (también la usa el comando /precios)

permissions:
  contents: write            # necesario para guardar precios_previos.json

concurrency:
  group: precios             # evita que dos ejecuciones se pisen al guardar el archivo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Ejecutar script
        # Programada: avisa solo si hay cambios. Manual: siempre envía el comparativo.
        run: python precios_farmacias.py ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar precios
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add precios_previos.json
          if ! git diff --cached --quiet; then
            git commit -m "actualiza precios"
            git push
          fi
